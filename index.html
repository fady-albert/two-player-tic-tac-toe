<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC TAC TOE</title>
    <!-- import css -->
    <link rel="stylesheet" href="./style.css">
    <!-- google icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

    <!-- mode button -->
    <button id="mode" class="mode">
        <span class="material-symbols-outlined">light_mode</span>
    </button>

    <!-- display -->
    <div class="display" id="display">
       <div class="content" id="content">
           <h1 id="head">tic-tac-toe</h1>
           <p id="hMsg">choose the game mode</p>
           <div class="btns">
               <button id="btn1">normal</button>
               <button id="btn2">limited</button>
           </div>        
        </div>
    </div>

    <!-- ai level -->
    <div class="aiLevel" id="aiDisplay">
        <h1>ai level</h1>
        <button id="easy">easy</button>
        <button id="medium">medium</button>
        <button id="hard">hard</button>

        <button id="back">
            <span class="material-symbols-outlined">arrow_back_ios_new</span>
        </button>
    </div>

    <div class="text">
        <h1>TIC TAC TOE</h1>
        <p id="message">Welcome to TIC TAC TOE !</p>
    </div>

    <!-- game board -->
    <div class="container">
        <div class="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        <button id="reset" class="reset">reset</button>
        <button id="resetScore" class="reset">reset score</button>
        <button id="showDisplay" class="reset">menu</button>
    </div>

    <div class="points" id="winX">0</div>
    <div class="points" id="winO">0</div>
    
    <!-- import js -->
    <script src="./script.js"></script>
</body>
</html>
